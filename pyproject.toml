[project]
name = "spatial-rx"
version = "0.1.0"
description = "Tools for exploring spatial omics data in notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ckmah" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "anywidget>=0.9.2",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "scipy>=1.11",
    "traitlets>=5.0",
]

[project.optional-dependencies]
demo = [
    "altair>=6.2.2",
    "geopandas>=1.1.4",
    "marimo>=0.24.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "shapely>=2.1.2",
    "squidpy>=1.6",
    "tifffile>=2026.3.3",
]
test = [
    "geopandas>=1.1.4",
    "pandas>=2.0",
    "pytest>=8.3.3",
    "shapely>=2.1.2",
]

[project.urls]
Homepage = "https://github.com/ckmah/spatial-rx"
Repository = "https://github.com/ckmah/spatial-rx"
Issues = "https://github.com/ckmah/spatial-rx/issues"

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "pytest>=8.3.3",
    "pyyaml>=6.0",
    "shapely>=2.1.2",
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_rx"]

[tool.hatch.build]
artifacts = ["spatial_rx/static/*"]

[tool.hatch.version]
path = "spatial_rx/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
