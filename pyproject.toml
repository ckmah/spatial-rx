[project]
name = "spatial-rx"
version = "0.1.0"
description = "Reactive spatial landmarks for matplotlib and marimo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ckmah" }]
dependencies = [
    "anywidget>=0.9.2",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "traitlets",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_rx"]

[tool.hatch.build]
artifacts = ["spatial_rx/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
