[project]
name = "spatial-rx"
version = "0.1.0"
description = "Tools for exploring spatial omics data in notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ckmah" }]
dependencies = [
    "altair>=6.2.2",
    "anywidget>=0.9.2",
    "geopandas>=1.1.4",
    "marimo>=0.24.0",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tifffile>=2026.3.3",
    "traitlets",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_rx"]

[tool.hatch.build]
artifacts = ["spatial_rx/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
