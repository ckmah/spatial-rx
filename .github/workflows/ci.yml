name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Verify bundles are up-to-date
        run: |
          git diff --exit-code spatial_rx/static/bundled/ || (echo "Bundles are stale. Run 'npm run build' in frontend/ and commit the result." && exit 1)

      - run: uv sync --extra test --group dev
      - run: uv run pytest
      - run: uv build
