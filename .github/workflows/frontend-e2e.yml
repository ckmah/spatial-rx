name: Frontend e2e

# Disabled while raster MVP UI is in flux — re-enable when snapshots are refreshed.
# Trigger manually via workflow_dispatch if needed.
on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-generate snapshots; download artifact and commit locally"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    if: false # hard-off until raster chrome snapshots are updated
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run e2e (compare committed Linux snapshots)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npm run test:e2e
        env:
          CI: true
          E2E_SCREENSHOTS: "1"

      - name: Update snapshots (artifact only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true }}
        run: npm run test:e2e:update
        env:
          CI: true
          E2E_SCREENSHOTS: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
